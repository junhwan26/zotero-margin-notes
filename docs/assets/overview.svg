    <rect x="351" y="265" width="186" height="22" rx="3" fill="#fff0a3"/>
    <text x="356" y="280" font-size="11" fill="#4d4b3d">Keep the important idea in view.</text>
    <rect x="571" y="280" width="194" height="22" rx="3" fill="#fbd4de"/>
    <text x="576" y="295" font-size="11" fill="#59464e">Compare findings across columns.</text>
