    <text x="863" y="292" font-size="12" fill="#74818c">“Compare findings…”</text>
    <text x="863" y="321" font-size="15" font-weight="600" fill="#25272b">Two columns.</text>
    <text x="863" y="342" font-size="15" font-weight="600" fill="#25272b">The right margin for each note.</text>
    <text x="863" y="370" font-size="11" fill="#5f6368">Double-click to edit</text>
