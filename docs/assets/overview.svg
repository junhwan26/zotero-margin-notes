<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Margin Notes: comments beside a two-column paper</title>
  <desc id="desc">A conceptual illustration of a Zotero PDF reader. Highlights in the left and right text columns connect to white comment cards in the corresponding outer margins.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1">
      <stop stop-color="#edf3f8"/>
      <stop offset="1" stop-color="#e2eaf2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#173452" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="1118" height="518" rx="18" fill="url(#surface)" stroke="#d5e0ea"/>
  <path d="M19 1h1082a18 18 0 0 1 18 18v37H1V19A18 18 0 0 1 19 1Z" fill="#f9fbfd"/>
  <path d="M1 56h1118" stroke="#d5e0ea"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <circle cx="24" cy="28" r="4" fill="#c2cfdb"/>
    <circle cx="39" cy="28" r="4" fill="#c2cfdb"/>
    <circle cx="54" cy="28" r="4" fill="#c2cfdb"/>
