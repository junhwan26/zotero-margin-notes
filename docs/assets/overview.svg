    <text x="1031" y="33" text-anchor="middle" font-size="12" fill="#526a80">Fit Notes</text>

    <rect x="320" y="78" width="480" height="416" rx="3" fill="#fff" stroke="#d4dee7" filter="url(#shadow)"/>
    <text x="356" y="112" font-size="11" letter-spacing="1.5" fill="#6f8294">RESEARCH PAPER</text>
    <text x="356" y="141" font-size="21" font-weight="700" fill="#263c50">A clearer way to read</text>
    <path d="M356 160h408" stroke="#cdd7e0"/>
    <text x="356" y="188" font-size="12" font-weight="700" fill="#425b72">1  Background</text>
    <text x="576" y="188" font-size="12" font-weight="700" fill="#425b72">2  Discussion</text>
    <g stroke="#c8d2dc" stroke-width="4" stroke-linecap="round">
      <path d="M356 208h178m-178 14h170m-170 14h180m-180 14h154"/>
      <path d="M576 208h178m-178 14h164m-164 14h182m-182 14h176m-176 14h150"/>
      <path d="M356 308h180m-180 14h171m-171 14h178m-178 14h152m-152 14h177m-177 14h168"/>
      <path d="M576 322h175m-175 14h184m-184 14h163m-163 14h179m-179 14h149m-149 14h181"/>
